name: Update Webmentions
on:
  schedule:
    # Runs every 12 hours (at minute 0)
    - cron: '0 */12 * * *' 
  workflow_dispatch: # Allows manual trigger from GitHub UI
jobs:
  trigger-netlify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify Build
        # We use the FULL URL stored in the secret
        run: curl -X POST -H "Content-Type: application/json" -d '{}' ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
